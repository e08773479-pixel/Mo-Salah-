<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | مهندس محمد صلاح</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, #12304a 0, transparent 35%),
        #080d18;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-box {
      width: min(950px, 100%);
      min-height: 570px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 30px;
      background: #101827;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 35px 100px rgba(0,0,0,0.45);
    }

    .teacher-side {
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        linear-gradient(
          145deg,
          rgba(15,35,55,0.95),
          rgba(7,15,27,0.98)
        );
    }

    .photo {
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 25px;
      border-radius: 28px;
      background: #172235;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .teacher-side h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .teacher-side p {
      text-align: center;
      color: #8d9aae;
    }

    .form-side {
      padding: 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-side h2 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #8996a9;
      margin-bottom: 35px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 9px;
      color: #d7deea;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #29364b;
      background: #0b1220;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .field input:focus {
      border-color: #0ea5e9;
    }

    .login-submit {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .back {
      display: block;
      text-align: center;
      color: #718096;
      text-decoration: none;
      margin-top: 22px;
      font-size: 14px;
    }

    @media (max-width: 750px) {
      .login-box {
        grid-template-columns: 1fr;
      }

      .teacher-side {
        padding: 25px;
      }

      .photo {
        max-width: 220px;
      }

      .form-side {
        padding: 30px 25px 35px;
      }
    }
  </style>
</head>

<body>

  <main class="login-box">

    <section class="teacher-side">

      <div class="photo">
        <img
          id="teacherImage"
          alt="صورة مهندس محمد صلاح"
        >
      </div>

      <h1>مهندس محمد صلاح</h1>
      <p>مدرس الفيزياء</p>

    </section>

    <section class="form-side">

      <h2>أهلاً بيك 👋</h2>

      <p class="subtitle">
        سجل دخولك إلى منصة مهندس محمد صلاح
        وابدأ رحلتك في الفيزياء.
      </p>

      <form>

        <div class="field">
          <label for="code">كود المنصة</label>

          <input
            id="code"
            type="text"
            placeholder="اكتب كود المنصة"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>

          <input
            id="password"
            type="password"
            placeholder="اكتب كلمة المرور"
          >
        </div>

        <button class="login-submit" type="submit">
          تسجيل الدخول
        </button>

      </form>

      <a class="back" href="index.html">
        العودة إلى الصفحة الرئيسية
      </a>

    </section>

  </main>

  <script>
    const image = document.getElementById("teacherImage");

    const imageNames = [
      "55",
      "55.jpg",
      "55.jpeg",
      "55.png",
      "55.webp"
    ];

    let currentImage = 0;

    function tryNextImage() {
      if (currentImage >= imageNames.length) {
        image.removeAttribute("src");
        return;
      }

      image.src = imageNames[currentImage];
      currentImage++;
    }

    image.addEventListener("error", tryNextImage);

    tryNextImage();
  </script>

</body>
</html>
