<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | مهندس محمد صلاح</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, #12304a 0, transparent 35%),
        #080d18;
      color: #fff;
      padding: 25px;
    }

    .topbar {
      width: min(1100px, 100%);
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-photo {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      overflow: hidden;
      background: #172235;
      border: 1px solid rgba(255,255,255,0.12);
      flex-shrink: 0;
    }

    .brand-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-info h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .brand-info p {
      color: #8d9aae;
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-actions a {
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .login-link {
      color: #fff;
      background: rgba(14,165,233,0.14);
      border: 1px solid rgba(14,165,233,0.25);
    }

    .register-link {
      color: #fff;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
    }

    .login-box {
      width: min(950px, 100%);
      min-height: 570px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 30px;
      background: #101827;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 35px 100px rgba(0,0,0,0.45);
    }

    .teacher-side {
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        linear-gradient(
          145deg,
          rgba(15,35,55,0.95),
          rgba(7,15,27,0.98)
        );
    }

    .photo {
      width: 100%;
      max-width: 330px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 25px;
      border-radius: 28px;
      background: #172235;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .teacher-side h2 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .teacher-side p {
      text-align: center;
      color: #8d9aae;
    }

    .form-side {
      padding: 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-side h2 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #8996a9;
      margin-bottom: 35px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 9px;
      color: #d7deea;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #29364b;
      background: #0b1220;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .field input:focus {
      border-color: #0ea5e9;
    }

    .login-submit {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .back {
      display: block;
      text-align: center;
      color: #718096;
      text-decoration: none;
      margin-top: 22px;
      font-size: 14px;
    }

    @media (max-width: 750px) {

      body {
        padding: 15px;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand-photo {
        width: 58px;
        height: 58px;
        border-radius: 17px;
      }

      .brand-info h1 {
        font-size: 16px;
      }

      .top-actions a {
        padding: 10px 12px;
        font-size: 12px;
      }

      .login-box {
        grid-template-columns: 1fr;
      }

      .teacher-side {
        padding: 25px;
      }

      .photo {
        max-width: 220px;
      }

      .form-side {
        padding: 30px 25px 35px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <div class="brand">

      <div class="brand-photo">
        <img id="brandImage" alt="مهندس محمد صلاح">
      </div>

      <div class="brand-info">
        <h1>مهندس محمد صلاح</h1>
        <p>مدرس الفيزياء</p>
      </div>

    </div>

    <nav class="top-actions">
      <a class="login-link" href="login.html">
        تسجيل الدخول
      </a>

      <a class="register-link" href="register.html">
        إنشاء حساب جديد
      </a>
    </nav>

  </header>

  <main class="login-box">

    <section class="teacher-side">

      <div class="photo">
        <img id="teacherImage" alt="صورة مهندس محمد صلاح">
      </div>

      <h2>مهندس محمد صلاح</h2>
      <p>مدرس الفيزياء</p>

    </section>

    <section class="form-side">

      <h2>أهلاً بيك 👋</h2>

      <p class="subtitle">
        سجل دخولك إلى منصة مهندس محمد صلاح
        وابدأ رحلتك في الفيزياء.
      </p>

      <form>

        <div class="field">
          <label for="code">كود المنصة</label>

          <input
            id="code"
            type="text"
            placeholder="اكتب كود المنصة"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>

          <input
            id="password"
            type="password"
            placeholder="اكتب كلمة المرور"
          >
        </div>

        <button class="login-submit" type="submit">
          تسجيل الدخول
        </button>

      </form>

      <a class="back" href="index.html">
        العودة إلى الصفحة الرئيسية
      </a>

    </section>

  </main>

  <script>
    const imageNames = [
      "55",
      "55.jpg",
      "55.jpeg",
      "55.png",
      "55.webp"
    ];

    function loadImage(elementId) {
      const element = document.getElementById(elementId);

      let index = 0;

      function tryImage() {
        if (index >= imageNames.length) {
          return;
        }

        element.src = imageNames[index];
        index++;
      }

      element.addEventListener("error", tryImage);
      tryImage();
    }

    loadImage("brandImage");
    loadImage("teacherImage");
  </script>

</body>
</html>
