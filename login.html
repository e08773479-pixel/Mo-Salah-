<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - منصة محمد صلاح</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      word-break: break-word;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
    }

    .register-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>تسجيل الدخول</h1>

    <div class="subtitle">
      منصة محمد صلاح التعليمية
    </div>

    <form id="loginForm">

      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
      >

      <label for="password">
        كلمة المرور
      </label>

      <input
        type="password"
        id="password"
        placeholder="اكتب كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        تسجيل الدخول
      </button>

    </form>

    <div
      id="errorMessage"
      class="message error"
    ></div>

    <div class="register-link">
      ليس لديك حساب؟
      <a href="register.html">إنشاء حساب جديد</a>
    </div>

  </div>


  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // ==========================================
    // Firebase Configuration
    // ==========================================

    const firebaseConfig = {

      apiKey: "AIzaSyBqCxGshGhKzSCoueSV8bVFcKxQWsZiu6M",

      authDomain:
        "mo-salah-physics.firebaseapp.com",

      databaseURL:
        "https://mo-salah-physics-default-rtdb.firebaseio.com",

      projectId:
        "mo-salah-physics",

      storageBucket:
        "mo-salah-physics.firebasestorage.app",

      messagingSenderId:
        "475289360145",

      appId:
        "1:475289360145:web:94b4ec58765a230f09deb0",

      measurementId:
        "G-JDEJE0CJBX"
    };


    // تشغيل Firebase

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    // عناصر الصفحة

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const errorMessage =
      document.getElementById("errorMessage");


    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";
    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        errorMessage.style.display =
          "none";

        button.disabled = true;

        button.textContent =
          "جاري تسجيل الدخول...";


        try {

          const email =
            document
              .getElementById("email")
              .value
              .trim();

          const password =
            document
              .getElementById("password")
              .value;


          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          // تسجيل الدخول نجح

          console.log(
            "Logged in user:",
            userCredential.user.uid
          );


          window.location.href =
            "dashboard.html";


        } catch (error) {

          console.error(error);

          // إظهار الخطأ الحقيقي على الشاشة لمعرفة سبب المشكلة بالتحديد
          showError("خطأ من فايربيس: " + error.code + " - " + error.message);

        } finally {

          button.disabled = false;

          button.textContent =
            "تسجيل الدخول";
        }

      }
    );

  </script>

</body>
</html>
