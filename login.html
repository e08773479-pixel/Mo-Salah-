<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070d13">
  <title>تسجيل الدخول | مهندس محمد صلاح</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070d13;
      --card: #0c151f;
      --card2: #101b26;
      --line: #24313d;
      --text: #f5f8fa;
      --muted: #8c99a6;
      --cyan: #22c7b8;
      --blue: #159bd7;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(24, 155, 215, .12),
          transparent 38%
        ),
        radial-gradient(
          circle at 15% 80%,
          rgba(34, 199, 184, .06),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      height: 70px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 13, 19, .88);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-image {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(
        145deg,
        var(--cyan),
        var(--blue)
      );
    }

    .brand-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name strong {
      display: block;
      font-size: 14px;
    }

    .brand-name span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-top: 4px;
    }

    .back {
      color: #b9c3cb;
      font-size: 11px;
    }

    .back:hover {
      color: var(--cyan);
    }

    /* CONTENT */

    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(
          145deg,
          rgba(16, 27, 38, .96),
          rgba(9, 17, 25, .96)
        );
      box-shadow: 0 25px 70px rgba(0, 0, 0, .42);
    }

    .teacher {
      text-align: center;
      margin-bottom: 24px;
    }

    .teacher-image {
      width: 82px;
      height: 82px;
      margin: 0 auto 13px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--cyan);
      box-shadow:
        0 0 0 5px rgba(34, 199, 184, .07),
        0 15px 35px rgba(0, 0, 0, .35);
    }

    .teacher-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .teacher h1 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .teacher p {
      color: var(--muted);
      font-size: 11px;
    }

    .title {
      text-align: center;
      font-size: 16px;
      margin-bottom: 23px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: #dbe3e8;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 48px;
      border: 1px solid #263541;
      outline: none;
      border-radius: 9px;
      background: #08111a;
      color: white;
      padding: 0 15px;
      transition: .2s;
    }

    .input-wrap input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(34, 199, 184, .08);
    }

    .input-wrap input::placeholder {
      color: #667581;
    }

    .password-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 10px;
    }

    .remember input {
      accent-color: var(--cyan);
    }

    .forgot {
      color: var(--cyan);
      font-size: 10px;
    }

    .login-button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      color: #041014;
      font-size: 12px;
      font-weight: bold;
      background:
        linear-gradient(
          135deg,
          var(--cyan),
          var(--blue)
        );
      transition: .2s;
    }

    .login-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #65737e;
      font-size: 9px;
      margin: 22px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .register-text {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    .register-text a {
      color: var(--cyan);
      font-weight: bold;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(34, 199, 184, .08);
      border: 1px solid rgba(34, 199, 184, .2);
      color: #9de8df;
      text-align: center;
      font-size: 10px;
    }

    /* MOBILE */

    @media (max-width: 520px) {

      header {
        height: 64px;
        padding: 0 16px;
      }

      .brand-image {
        width: 39px;
        height: 39px;
      }

      .brand-name strong {
        font-size: 12px;
      }

      .brand-name span {
        font-size: 8px;
      }

      .back {
        font-size: 9px;
      }

      .content {
        padding: 24px 15px;
      }

      .login-box {
        padding: 25px 19px;
        border-radius: 15px;
      }

      .teacher-image {
        width: 76px;
        height: 76px;
      }

      .teacher h1 {
        font-size: 20px;
      }

      .title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>

      <a class="brand" href="index.html">

        <div class="brand-image">
          <img src="55.jpg" alt="مهندس محمد صلاح">
        </div>

        <div class="brand-name">
          <strong>منصة محمد صلاح</strong>
          <span>فيزياء</span>
        </div>

      </a>

      <a class="back" href="index.html">
        العودة للرئيسية
      </a>

    </header>


    <main class="content">

      <section class="login-box">

        <div class="teacher">

          <div class="teacher-image">
            <img src="55.jpg" alt="مهندس محمد صلاح">
          </div>

          <h1>مهندس محمد صلاح</h1>

          <p>منصة الفيزياء التعليمية</p>

        </div>


        <h2 class="title">
          تسجيل الدخول
        </h2>


        <form id="loginForm">

          <div class="field">

            <label for="phone">
              رقم الهاتف أو البريد الإلكتروني
            </label>

            <div class="input-wrap">
              <input
                id="phone"
                type="text"
                placeholder="اكتب رقم الهاتف أو البريد الإلكتروني"
                autocomplete="username"
                required
              >
            </div>

          </div>


          <div class="field">

            <label for="password">
              كلمة المرور
            </label>

            <div class="input-wrap">
              <input
                id="password"
                type="password"
                placeholder="اكتب كلمة المرور"
                autocomplete="current-password"
                required
              >
            </div>

          </div>


          <div class="password-row">

            <label class="remember">
              <input
                type="checkbox"
                id="remember"
              >
              تذكرني
            </label>

            <a
              class="forgot"
              href="#"
              onclick="forgotPassword(event)"
            >
              نسيت كلمة المرور؟
            </a>

          </div>


          <button
            class="login-button"
            type="submit"
          >
            تسجيل الدخول
          </button>


          <div
            class="message"
            id="message"
          ></div>

        </form>


        <div class="divider">
          أو
        </div>


        <div class="register-text">

          ليس لديك حساب؟

          <a href="register.html">
            إنشاء حساب جديد
          </a>

        </div>

      </section>

    </main>

  </div>


  <script>

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
        document.getElementById("phone").value.trim();

      const password =
        document.getElementById("password").value.trim();

      if (!username || !password) {
        showMessage("من فضلك اكتب بيانات تسجيل الدخول.");
        return;
      }

      /*
        تسجيل الدخول الحقيقي وقاعدة البيانات
        هنربطهم في المرحلة القادمة.
      */

      showMessage(
        "تم استلام البيانات. سيتم تفعيل تسجيل الدخول مع قاعدة البيانات في الخطوة القادمة."
      );

    });


    function showMessage(text) {

      message.textContent = text;
      message.style.display = "block";

    }


    function forgotPassword(event) {

      event.preventDefault();

      showMessage(
        "استعادة كلمة المرور سيتم تفعيلها مع نظام الحسابات."
      );

    }

  </script>

</body>
</html>
