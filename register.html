<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070d13">
  <title>إنشاء حساب | مهندس محمد صلاح</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070d13;
      --card: #0c151f;
      --line: #24313d;
      --text: #f5f8fa;
      --muted: #8c99a6;
      --cyan: #22c7b8;
      --blue: #159bd7;
      --danger: #ff6b6b;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(24, 155, 215, .12),
          transparent 38%
        ),
        radial-gradient(
          circle at 15% 80%,
          rgba(34, 199, 184, .06),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    input,
    button {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      height: 70px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 13, 19, .88);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-image {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(
        145deg,
        var(--cyan),
        var(--blue)
      );
    }

    .brand-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name strong {
      display: block;
      font-size: 14px;
    }

    .brand-name span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-top: 4px;
    }

    .back {
      color: #b9c3cb;
      font-size: 11px;
    }

    .back:hover {
      color: var(--cyan);
    }

    /* CONTENT */

    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
    }

    .register-box {
      width: 100%;
      max-width: 470px;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(
          145deg,
          rgba(16, 27, 38, .97),
          rgba(9, 17, 25, .97)
        );
      box-shadow: 0 25px 70px rgba(0, 0, 0, .42);
    }

    .teacher {
      text-align: center;
      margin-bottom: 22px;
    }

    .teacher-image {
      width: 76px;
      height: 76px;
      margin: 0 auto 11px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--cyan);
      box-shadow:
        0 0 0 5px rgba(34, 199, 184, .07),
        0 15px 35px rgba(0, 0, 0, .35);
    }

    .teacher-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .teacher h1 {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .teacher p {
      color: var(--muted);
      font-size: 10px;
    }

    .title {
      text-align: center;
      font-size: 16px;
      margin-bottom: 21px;
    }

    /* FORM */

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      color: #dbe3e8;
      font-size: 10px;
      margin-bottom: 7px;
    }

    .input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #263541;
      outline: none;
      border-radius: 9px;
      background: #08111a;
      color: white;
      transition: .2s;
    }

    .input:focus {
      border-color: var(--cyan);
      box-shadow:
        0 0 0 3px rgba(34, 199, 184, .08);
    }

    .input::placeholder {
      color: #667581;
    }

    .platform-code {
      border-color: rgba(34, 199, 184, .35);
    }

    .hint {
      color: #65737e;
      font-size: 8px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .password-strength {
      height: 3px;
      margin-top: 7px;
      border-radius: 10px;
      background: #1b2731;
      overflow: hidden;
    }

    .password-strength span {
      display: block;
      height: 100%;
      width: 0;
      transition: .25s;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 16px 0;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.7;
    }

    .terms input {
      margin-top: 2px;
      accent-color: var(--cyan);
    }

    .terms a {
      color: var(--cyan);
    }

    .register-button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      color: #041014;
      font-size: 12px;
      font-weight: bold;
      background:
        linear-gradient(
          135deg,
          var(--cyan),
          var(--blue)
        );
      transition: .2s;
    }

    .register-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .message {
      display: none;
      margin-top: 13px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 9px;
      line-height: 1.7;
    }

    .message.success {
      display: block;
      color: #9de8df;
      background: rgba(34, 199, 184, .08);
      border: 1px solid rgba(34, 199, 184, .2);
    }

    .message.error {
      display: block;
      color: #ffb0b0;
      background: rgba(255, 107, 107, .07);
      border: 1px solid rgba(255, 107, 107, .2);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #65737e;
      font-size: 9px;
      margin: 20px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .login-text {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    .login-text a {
      color: var(--cyan);
      font-weight: bold;
    }

    /* MOBILE */

    @media (max-width: 520px) {

      header {
        height: 64px;
        padding: 0 16px;
      }

      .brand-image {
        width: 39px;
        height: 39px;
      }

      .brand-name strong {
        font-size: 12px;
      }

      .brand-name span {
        font-size: 8px;
      }

      .back {
        font-size: 9px;
      }

      .content {
        padding: 22px 14px;
      }

      .register-box {
        padding: 23px 18px;
        border-radius: 15px;
      }

      .teacher-image {
        width: 70px;
        height: 70px;
      }

      .teacher h1 {
        font-size: 18px;
      }

      .title {
        font-size: 14px;
      }

      .input {
        height: 45px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>

      <a class="brand" href="index.html">

        <div class="brand-image">
          <img
            src="55.jpg"
            alt="مهندس محمد صلاح"
          >
        </div>

        <div class="brand-name">
          <strong>منصة محمد صلاح</strong>
          <span>فيزياء</span>
        </div>

      </a>

      <a
        class="back"
        href="index.html"
      >
        العودة للرئيسية
      </a>

    </header>


    <main class="content">

      <section class="register-box">

        <div class="teacher">

          <div class="teacher-image">
            <img
              src="55.jpg"
              alt="مهندس محمد صلاح"
            >
          </div>

          <h1>مهندس محمد صلاح</h1>

          <p>منصة الفيزياء التعليمية</p>

        </div>


        <h2 class="title">
          إنشاء حساب جديد
        </h2>


        <form id="registerForm">

          <div class="field">

            <label for="name">
              الاسم بالكامل
            </label>

            <input
              class="input"
              id="name"
              type="text"
              placeholder="اكتب اسمك بالكامل"
              autocomplete="name"
              required
            >

          </div>


          <div class="field">

            <label for="phone">
              رقم الهاتف
            </label>

            <input
              class="input"
              id="phone"
              type="tel"
              inputmode="tel"
              placeholder="01xxxxxxxxx"
              autocomplete="tel"
              required
            >

          </div>


          <div class="field">

            <label for="email">
              البريد الإلكتروني
              <span style="color:#65737e;">
                (اختياري)
              </span>
            </label>

            <input
              class="input"
              id="email"
              type="email"
              placeholder="example@email.com"
              autocomplete="email"
            >

          </div>


          <div class="field">

            <label for="platformCode">
              كود المنصة
            </label>

            <input
              class="input platform-code"
              id="platformCode"
              type="text"
              placeholder="اكتب كود المنصة"
              autocomplete="off"
              required
            >

            <div class="hint">
              كود المنصة سيتم استخدامه للتحقق من صلاحية إنشاء الحساب.
            </div>

          </div>


          <div class="field">

            <label for="password">
              كلمة المرور
            </label>

            <input
              class="input"
              id="password"
              type="password"
              placeholder="اكتب كلمة مرور قوية"
              autocomplete="new-password"
              required
            >

            <div class="password-strength">
              <span id="strengthBar"></span>
            </div>

          </div>


          <div class="field">

            <label for="confirmPassword">
              تأكيد كلمة المرور
            </label>

            <input
              class="input"
              id="confirmPassword"
              type="password"
              placeholder="أعد كتابة كلمة المرور"
              autocomplete="new-password"
              required
            >

          </div>


          <label class="terms">

            <input
              type="checkbox"
              id="terms"
              required
            >

            <span>
              أوافق على شروط استخدام المنصة
              وسياسة الاستخدام.
            </span>

          </label>


          <button
            class="register-button"
            type="submit"
          >
            إنشاء الحساب
          </button>


          <div
            id="message"
            class="message"
          ></div>

        </form>


        <div class="divider">
          أو
        </div>


        <div class="login-text">

          لديك حساب بالفعل؟

          <a href="login.html">
            تسجيل الدخول
          </a>

        </div>

      </section>

    </main>

  </div>


  <script>

    const form =
      document.getElementById("registerForm");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const strengthBar =
      document.getElementById("strengthBar");

    const message =
      document.getElementById("message");


    /* PASSWORD STRENGTH */

    password.addEventListener(
      "input",
      function () {

        const value = password.value;

        let strength = 0;

        if (value.length >= 6) {
          strength += 25;
        }

        if (/[A-Z]/.test(value)) {
          strength += 25;
        }

        if (/[0-9]/.test(value)) {
          strength += 25;
        }

        if (/[^A-Za-z0-9]/.test(value)) {
          strength += 25;
        }

        strengthBar.style.width =
          strength + "%";

      }
    );


    /* REGISTER */

    form.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        const name =
          document.getElementById("name")
            .value.trim();

        const phone =
          document.getElementById("phone")
            .value.trim();

        const email =
          document.getElementById("email")
            .value.trim();

        const platformCode =
          document.getElementById("platformCode")
            .value.trim();

        const passwordValue =
          password.value;

        const confirmValue =
          confirmPassword.value;

        const terms =
          document.getElementById("terms")
            .checked;


        if (
          !name ||
          !phone ||
          !platformCode ||
          !passwordValue ||
          !confirmValue
        ) {

          showError(
            "من فضلك أكمل جميع البيانات المطلوبة."
          );

          return;
        }


        if (
          passwordValue.length < 6
        ) {

          showError(
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
          );

          return;
        }


        if (
          passwordValue !== confirmValue
        ) {

          showError(
            "كلمتا المرور غير متطابقتين."
          );

          return;
        }


        if (!terms) {

          showError(
            "يجب الموافقة على شروط استخدام المنصة."
          );

          return;
        }


        /*
          قاعدة البيانات والتحقق من كود المنصة
          سيتم ربطهما في المرحلة القادمة.
        */

        showSuccess(
          "تم استلام بيانات التسجيل بنجاح. سيتم تفعيل إنشاء الحساب الحقيقي عند ربط قاعدة البيانات."
        );

      }
    );


    function showError(text) {

      message.textContent = text;

      message.className =
        "message error";

    }


    function showSuccess(text) {

      message.textContent = text;

      message.className =
        "message success";

    }

  </script>

</body>
</html>
