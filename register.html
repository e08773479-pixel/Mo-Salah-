<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب - منصة محمد صلاح</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      color: #111827;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #374151;
    }

    .required {
      color: #dc2626;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .code-note {
      margin-top: 6px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>إنشاء حساب</h1>

  <div class="subtitle">
    منصة محمد صلاح التعليمية
  </div>

  <form id="registerForm">

    <div class="form-group">
      <label>
        الاسم الكامل <span class="required">*</span>
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="اكتب اسمك بالكامل"
        required
      >
    </div>


    <div class="form-group">
      <label>
        رقم الهاتف <span class="required">*</span>
      </label>

      <input
        type="tel"
        id="studentPhone"
        placeholder="01xxxxxxxxx"
        required
      >
    </div>


    <div class="form-group">
      <label>
        البريد الإلكتروني <span class="required">*</span>
      </label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >
    </div>


    <div class="form-group">
      <label>
        الصف الدراسي <span class="required">*</span>
      </label>

      <select id="grade" required>

        <option value="">
          اختر الصف الدراسي
        </option>

        <option value="أولى ثانوي">
          أولى ثانوي
        </option>

        <option value="تانية ثانوي">
          تانية ثانوي
        </option>

        <option value="تالتة ثانوي">
          تالتة ثانوي
        </option>

      </select>
    </div>


    <div class="form-group">
      <label>
        اسم ولي الأمر <span class="required">*</span>
      </label>

      <input
        type="text"
        id="parentName"
        placeholder="اكتب اسم ولي الأمر"
        required
      >
    </div>


    <div class="form-group">
      <label>
        رقم ولي الأمر <span class="required">*</span>
      </label>

      <input
        type="tel"
        id="parentPhone"
        placeholder="01xxxxxxxxx"
        required
      >
    </div>


    <div class="form-group">
      <label>
        كود المنصة <span class="required">*</span>
      </label>

      <input
        type="text"
        id="platformCode"
        placeholder="أدخل كود الـ 6 أرقام"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        required
      >

      <div class="code-note">
        الكود مكون من 6 أرقام.
      </div>
    </div>


    <div class="form-group">
      <label>
        كلمة المرور <span class="required">*</span>
      </label>

      <input
        type="password"
        id="password"
        placeholder="6 أحرف أو أرقام على الأقل"
        minlength="6"
        required
      >
    </div>


    <div class="form-group">
      <label>
        تأكيد كلمة المرور <span class="required">*</span>
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="أعد كتابة كلمة المرور"
        minlength="6"
        required
      >
    </div>


    <button
      type="submit"
      id="registerButton"
    >
      إنشاء الحساب
    </button>

  </form>


  <div
    id="successMessage"
    class="message success"
  ></div>


  <div
    id="errorMessage"
    class="message error"
  ></div>


  <div class="login-link">
    لديك حساب بالفعل؟
    <a href="login.html">
      تسجيل الدخول
    </a>
  </div>

</div>


<script type="module">

  /* =========================================
     Firebase
     ========================================= */

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    serverTimestamp
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================================
     Firebase Config
     ========================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyBqCxGshGhKzSCoueSV8bVFcKxQWsZiu6M",

    authDomain:
      "mo-salah-physics.firebaseapp.com",

    databaseURL:
      "https://mo-salah-physics-default-rtdb.firebaseio.com",

    projectId:
      "mo-salah-physics",

    storageBucket:
      "mo-salah-physics.firebasestorage.app",

    messagingSenderId:
      "475289360145",

    appId:
      "1:475289360145:web:94b4ec58765a230f09deb0",

    measurementId:
      "G-JDEJE0CJBX"
  };


  /* =========================================
     تشغيل Firebase
     ========================================= */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================================
     عناصر الصفحة
     ========================================= */

  const form =
    document.getElementById("registerForm");

  const button =
    document.getElementById("registerButton");

  const successMessage =
    document.getElementById("successMessage");

  const errorMessage =
    document.getElementById("errorMessage");


  /* =========================================
     رسائل
     ========================================= */

  function showError(message) {

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";

    successMessage.style.display =
      "none";
  }


  function showSuccess(message) {

    successMessage.textContent =
      message;

    successMessage.style.display =
      "block";

    errorMessage.style.display =
      "none";
  }


  /* =========================================
     التسجيل
     ========================================= */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      button.disabled = true;

      button.textContent =
        "جاري إنشاء الحساب...";


      try {

        /* ===============================
           قراءة البيانات
           =============================== */

        const fullName =
          document
            .getElementById("fullName")
            .value
            .trim();

        const studentPhone =
          document
            .getElementById("studentPhone")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const grade =
          document
            .getElementById("grade")
            .value;

        const parentName =
          document
            .getElementById("parentName")
            .value
            .trim();

        const parentPhone =
          document
            .getElementById("parentPhone")
            .value
            .trim();

        const platformCode =
          document
            .getElementById("platformCode")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        /* ===============================
           التحقق
           =============================== */

        if (!email) {

          throw new Error(
            "البريد الإلكتروني إجباري."
          );
        }


        if (password.length < 6) {

          throw new Error(
            "كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل."
          );
        }


        if (password !== confirmPassword) {

          throw new Error(
            "كلمتا المرور غير متطابقتين."
          );
        }


        if (!/^[0-9]{6}$/.test(platformCode)) {

          throw new Error(
            "كود المنصة يجب أن يكون 6 أرقام."
          );
        }


        /* ===============================
           فحص الكود
           =============================== */

        const codeRef =
          doc(
            db,
            "platform_codes",
            platformCode
          );


        const codeSnapshot =
          await getDoc(codeRef);


        if (!codeSnapshot.exists()) {

          throw new Error(
            "كود المنصة غير موجود."
          );
        }


        const codeData =
          codeSnapshot.data();


        if (codeData.status === "used") {

          throw new Error(
            "هذا الكود مستخدم بالفعل."
          );
        }


        /* ===============================
           إنشاء حساب Authentication
           =============================== */

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        /* ===============================
           تاريخ الاشتراك
           =============================== */

        const startDate =
          new Date();


        const endDate =
          new Date(startDate);


        endDate.setMonth(
          endDate.getMonth() + 1
        );


        /* ===============================
           حفظ الطالب
           =============================== */

        await setDoc(
          doc(
            db,
            "students",
            user.uid
          ),
          {

            fullName:
              fullName,

            studentPhone:
              studentPhone,

            email:
              email,

            grade:
              grade,

            parentName:
              parentName,

            parentPhone:
              parentPhone,

            platformCode:
              platformCode,

            subscriptionStart:
              serverTimestamp(),

            subscriptionEnd:
              endDate,

            createdAt:
              serverTimestamp()

          }
        );


        /* ===============================
           تحديث الكود
           =============================== */

        await updateDoc(
          codeRef,
          {

            status:
              "used",

            studentId:
              user.uid,

            activatedAt:
              serverTimestamp(),

            expiresAt:
              endDate

          }
        );


        /* ===============================
           نجاح
           =============================== */

        showSuccess(
          "تم إنشاء الحساب وتفعيل الاشتراك بنجاح."
        );


        form.reset();


        setTimeout(
          function() {

            window.location.href =
              "login.html";

          },
          1800
        );


      } catch (error) {

        console.error(
          "Firebase registration error:",
          error
        );


        let message =
          "حدث خطأ أثناء إنشاء الحساب.";


        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          message =
            "البريد الإلكتروني مستخدم بالفعل.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "البريد الإلكتروني غير صحيح.";

        }

        else if (
          error.code ===
          "auth/weak-password"
        ) {

          message =
            "كلمة المرور ضعيفة.";

        }

        else if (
          error.code ===
          "permission-denied" ||
          error.code ===
          "firestore/permission-denied"
        ) {

          message =
            "ليس لدى الصفحة صلاحية للوصول إلى Firestore. راجع Rules.";

        }

        else if (error.message) {

          message =
            error.message;

        }


        showError(message);


      } finally {

        button.disabled =
          false;

        button.textContent =
          "إنشاء الحساب";

      }

    });

</script>

</body>
</html>
