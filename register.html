register.html

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - منصة محمد صلاح</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .required {
      color: red;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>إنشاء حساب</h1>

    <div class="subtitle">
      منصة محمد صلاح التعليمية
    </div>

    <form id="registerForm">

      <label>
        الاسم الكامل <span class="required">*</span>
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="اكتب اسمك بالكامل"
        required
      >

      <label>
        رقم الهاتف <span class="required">*</span>
      </label>

      <input
        type="tel"
        id="studentPhone"
        placeholder="01xxxxxxxxx"
        required
      >

      <label>
        البريد الإلكتروني
        <small>(اختياري)</small>
      </label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
      >

      <label>
        الصف الدراسي <span class="required">*</span>
      </label>

      <select id="grade" required>
        <option value="">اختر الصف</option>
        <option value="أولى ثانوي">أولى ثانوي</option>
        <option value="تانية ثانوي">تانية ثانوي</option>
        <option value="تالتة ثانوي">تالتة ثانوي</option>
      </select>

      <label>
        اسم ولي الأمر <span class="required">*</span>
      </label>

      <input
        type="text"
        id="parentName"
        placeholder="اسم ولي الأمر"
        required
      >

      <label>
        رقم ولي الأمر <span class="required">*</span>
      </label>

      <input
        type="tel"
        id="parentPhone"
        placeholder="01xxxxxxxxx"
        required
      >

      <label>
        كود المنصة <span class="required">*</span>
      </label>

      <input
        type="text"
        id="platformCode"
        placeholder="أدخل كود الـ 6 أرقام"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        required
      >

      <label>
        كلمة المرور <span class="required">*</span>
      </label>

      <input
        type="password"
        id="password"
        placeholder="6 أحرف أو أرقام على الأقل"
        minlength="6"
        required
      >

      <label>
        تأكيد كلمة المرور <span class="required">*</span>
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="أعد كتابة كلمة المرور"
        minlength="6"
        required
      >

      <button type="submit" id="registerButton">
        إنشاء الحساب
      </button>

    </form>

    <div id="successMessage" class="message success"></div>
    <div id="errorMessage" class="message error"></div>

    <div class="login-link">
      لديك حساب بالفعل؟
      <a href="login.html">تسجيل الدخول</a>
    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      updateDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ==========================================
    // Firebase Configuration
    // ==========================================

    const firebaseConfig = {
      apiKey: "ضع_apiKey_هنا",
      authDomain: "mo-salah-physics.firebaseapp.com",
      databaseURL: "https://mo-salah-physics-default-rtdb.firebaseio.com",
      projectId: "mo-salah-physics",
      storageBucket: "mo-salah-physics.firebasestorage.app",
      messagingSenderId: "475289360145",
      appId: "1:475289360145:web:94b4ec58765a230f09deb0",
      measurementId: "G-JDEJE0CJBX"
    };


    // تشغيل Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // عناصر الصفحة
    // ==========================================

    const form = document.getElementById("registerForm");

    const button = document.getElementById("registerButton");

    const successMessage =
      document.getElementById("successMessage");

    const errorMessage =
      document.getElementById("errorMessage");


    // ==========================================
    // رسائل
    // ==========================================

    function showError(message) {

      errorMessage.textContent = message;

      errorMessage.style.display = "block";

      successMessage.style.display = "none";
    }


    function showSuccess(message) {

      successMessage.textContent = message;

      successMessage.style.display = "block";

      errorMessage.style.display = "none";
    }


    // ==========================================
    // التسجيل
    // ==========================================

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      button.disabled = true;

      button.textContent = "جاري إنشاء الحساب...";


      try {

        const fullName =
          document.getElementById("fullName").value.trim();

        const studentPhone =
          document.getElementById("studentPhone").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const grade =
          document.getElementById("grade").value;

        const parentName =
          document.getElementById("parentName").value.trim();

        const parentPhone =
          document.getElementById("parentPhone").value.trim();

        const platformCode =
          document.getElementById("platformCode").value.trim();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;


        // ==========================================
        // التحقق من البيانات
        // ==========================================

        if (!fullName) {
          throw new Error("اكتب الاسم بالكامل.");
        }

        if (!studentPhone) {
          throw new Error("اكتب رقم الهاتف.");
        }

        if (!grade) {
          throw new Error("اختار الصف الدراسي.");
        }

        if (!parentName) {
          throw new Error("اكتب اسم ولي الأمر.");
        }

        if (!parentPhone) {
          throw new Error("اكتب رقم ولي الأمر.");
        }

        if (!/^[0-9]{6}$/.test(platformCode)) {
          throw new Error("كود المنصة لازم يكون 6 أرقام.");
        }

        if (password.length < 6) {
          throw new Error("كلمة المرور لازم تكون 6 أحرف أو أرقام على الأقل.");
        }

        if (password !== confirmPassword) {
          throw new Error("كلمتا المرور غير متطابقتين.");
        }


        // ==========================================
        // البحث عن الكود
        // ==========================================

        const codeRef =
          doc(db, "platform_codes", platformCode);

        const codeSnapshot =
          await getDoc(codeRef);


        if (!codeSnapshot.exists()) {

          throw new Error(
            "كود المنصة غير موجود."
          );

        }


        const codeData =
          codeSnapshot.data();


        if (codeData.status === "used") {

          throw new Error(
            "هذا الكود مستخدم بالفعل."
          );

        }


        // ==========================================
        // البريد مطلوب حاليًا لأننا نستخدم
        // Firebase Email/Password
        // ==========================================

        if (!email) {

          throw new Error(
            "البريد الإلكتروني مطلوب حاليًا لإنشاء الحساب."
          );

        }


        // ==========================================
        // إنشاء حساب Firebase
        // ==========================================

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        // ==========================================
        // بيانات الطالب
        // ==========================================

        const studentData = {

          fullName: fullName,

          studentPhone: studentPhone,

          email: email,

          grade: grade,

          parentName: parentName,

          parentPhone: parentPhone,

          platformCode: platformCode,

          subscriptionStart: null,

          subscriptionEnd: null,

          createdAt: serverTimestamp()

        };


        // ==========================================
        // حفظ الطالب
        // ==========================================

        await setDoc(
          doc(db, "students", user.uid),
          studentData
        );


        // ==========================================
        // ربط الكود بالطالب
        //
        // ملاحظة:
        // هنا بنعتبر التسجيل هو لحظة التفعيل الأولى.
        // تاريخ الانتهاء النهائي هنخليه يتحسب
        // من السيرفر بشكل آمن عند اكتمال النظام.
        // ==========================================

        const now =
          new Date();

        const expires =
          new Date(now);

        expires.setMonth(
          expires.getMonth() + 1
        );


        await updateDoc(
          codeRef,
          {

            status: "used",

            studentId: user.uid,

            activatedAt: serverTimestamp(),

            expiresAt: expires

          }
        );


        showSuccess(
          "تم إنشاء الحساب بنجاح."
        );


        form.reset();


        setTimeout(() => {

          window.location.href =
            "login.html";

        }, 1800);


      } catch (error) {

        console.error(error);


        let message =
          "حدث خطأ أثناء إنشاء الحساب.";


        if (error.code ===
            "auth/email-already-in-use") {

          message =
            "البريد الإلكتروني مستخدم بالفعل.";

        } else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "البريد الإلكتروني غير صحيح.";

        } else if (
          error.code ===
          "auth/weak-password"
        ) {

          message =
            "كلمة المرور ضعيفة.";

        } else if (error.message) {

          message =
            error.message;

        }


        showError(message);


      } finally {

        button.disabled = false;

        button.textContent =
          "إنشاء الحساب";

      }

    });

  </script>

</body>
</html>
