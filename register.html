<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#070d13"
  >

  <title>
    إنشاء حساب | منصة مهندس محمد صلاح
  </title>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    :root {

      --bg: #070d13;

      --panel: #0c151f;

      --panel2: #101b26;

      --line: #24313d;

      --text: #f5f8fa;

      --muted: #8c99a6;

      --cyan: #22c7b8;

      --blue: #159bd7;

      --danger: #e85d6a;

    }


    body {

      min-height: 100vh;

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(21,155,215,.12),
          transparent 35%
        ),

        var(--bg);

      color: var(--text);

      font-family:
        Tahoma,
        Arial,
        sans-serif;

    }


    button,
    input,
    select {

      font: inherit;

    }


    a {

      color: inherit;

      text-decoration: none;

    }


    .page {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px 15px;

    }


    .register-wrapper {

      width: 100%;

      max-width: 470px;

    }


    /* =========================
       الهوية
    ========================== */


    .brand {

      text-align: center;

      margin-bottom: 20px;

    }


    .teacher-image {

      width: 95px;

      height: 95px;

      margin: 0 auto 12px;

      border-radius: 50%;

      overflow: hidden;

      border: 2px solid var(--cyan);

      box-shadow:

        0 0 0 6px
        rgba(34,199,184,.06),

        0 10px 35px
        rgba(0,0,0,.35);

    }


    .teacher-image img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    .brand h1 {

      font-size: 22px;

      margin-bottom: 7px;

    }


    .brand p {

      color: var(--muted);

      font-size: 10px;

    }


    /* =========================
       الكارت
    ========================== */


    .register-card {

      width: 100%;

      padding: 25px;

      border: 1px solid var(--line);

      border-radius: 18px;

      background:

        linear-gradient(
          145deg,
          rgba(16,27,38,.97),
          rgba(8,15,22,.97)
        );

      box-shadow:

        0 20px 60px
        rgba(0,0,0,.35);

    }


    .card-title {

      margin-bottom: 20px;

    }


    .card-title h2 {

      font-size: 17px;

      margin-bottom: 6px;

    }


    .card-title p {

      color: var(--muted);

      font-size: 9px;

      line-height: 1.8;

    }


    /* =========================
       الحقول
    ========================== */


    .field {

      margin-bottom: 13px;

    }


    .field label {

      display: block;

      margin-bottom: 7px;

      color: #dce4e9;

      font-size: 9px;

    }


    .required {

      color: var(--cyan);

    }


    .optional {

      color: #63717c;

      font-size: 7px;

      margin-right: 4px;

    }


    .input-wrapper {

      position: relative;

    }


    .input-wrapper input,
    .input-wrapper select {

      width: 100%;

      height: 47px;

      padding: 0 42px 0 14px;

      border: 1px solid var(--line);

      border-radius: 9px;

      outline: none;

      background: var(--panel2);

      color: var(--text);

      font-size: 10px;

      transition: .2s;

    }


    .input-wrapper input {

      direction: rtl;

    }


    .input-wrapper input::placeholder {

      color: #62717d;

    }


    .input-wrapper input:focus,
    .input-wrapper select:focus {

      border-color: var(--cyan);

      box-shadow:

        0 0 0 3px
        rgba(34,199,184,.07);

    }


    .input-wrapper select {

      cursor: pointer;

      appearance: auto;

    }


    .input-icon {

      position: absolute;

      right: 14px;

      top: 50%;

      transform: translateY(-50%);

      color: var(--cyan);

      font-size: 14px;

      pointer-events: none;

    }


    /* =========================
       تقسيم
    ========================== */


    .section-title {

      display: flex;

      align-items: center;

      gap: 9px;

      margin: 20px 0 13px;

      color: var(--cyan);

      font-size: 10px;

      font-weight: bold;

    }


    .section-title::after {

      content: "";

      height: 1px;

      flex: 1;

      background: var(--line);

    }


    /* =========================
       كلمة المرور
    ========================== */


    .password-wrapper {

      position: relative;

    }


    .password-wrapper input {

      padding-left: 55px;

    }


    .show-password {

      position: absolute;

      left: 10px;

      top: 50%;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: var(--muted);

      font-size: 8px;

      cursor: pointer;

    }


    .show-password:hover {

      color: var(--cyan);

    }


    .password-strength {

      height: 3px;

      margin-top: 7px;

      border-radius: 5px;

      background: #1c2832;

      overflow: hidden;

    }


    .password-strength-bar {

      height: 100%;

      width: 0%;

      transition: .25s;

    }


    .password-hint {

      margin-top: 6px;

      color: #63717c;

      font-size: 7px;

    }


    /* =========================
       الموافقة
    ========================== */


    .terms {

      display: flex;

      align-items: flex-start;

      gap: 8px;

      margin: 17px 0;

      color: var(--muted);

      font-size: 8px;

      line-height: 1.7;

    }


    .terms input {

      margin-top: 3px;

      accent-color: var(--cyan);

    }


    /* =========================
       زر التسجيل
    ========================== */


    .register-button {

      width: 100%;

      height: 48px;

      border: 0;

      border-radius: 9px;

      color: #041014;

      font-size: 10px;

      font-weight: bold;

      background:

        linear-gradient(
          135deg,
          var(--cyan),
          var(--blue)
        );

      cursor: pointer;

      transition: .2s;

    }


    .register-button:hover {

      transform: translateY(-1px);

      box-shadow:

        0 8px 25px
        rgba(34,199,184,.15);

    }


    .register-button:disabled {

      opacity: .65;

      cursor: wait;

      transform: none;

    }


    /* =========================
       الرسائل
    ========================== */


    .message {

      display: none;

      margin-top: 12px;

      padding: 10px;

      border-radius: 8px;

      font-size: 8px;

      line-height: 1.7;

      text-align: center;

    }


    .message.error {

      display: block;

      color: #ff9ca5;

      border:

        1px solid
        rgba(232,93,106,.25);

      background:

        rgba(232,93,106,.06);

    }


    .message.success {

      display: block;

      color: var(--cyan);

      border:

        1px solid
        rgba(34,199,184,.25);

      background:

        rgba(34,199,184,.06);

    }


    /* =========================
       تسجيل الدخول
    ========================== */


    .login-box {

      margin-top: 18px;

      padding-top: 18px;

      border-top: 1px solid var(--line);

      text-align: center;

    }


    .login-box p {

      color: var(--muted);

      font-size: 9px;

      margin-bottom: 9px;

    }


    .login-button {

      display: block;

      width: 100%;

      padding: 12px;

      border:

        1px solid
        rgba(34,199,184,.25);

      border-radius: 9px;

      color: var(--cyan);

      background:

        rgba(34,199,184,.04);

      font-size: 9px;

      transition: .2s;

    }


    .login-button:hover {

      background:

        rgba(34,199,184,.09);

      border-color: var(--cyan);

    }


    /* =========================
       Footer
    ========================== */


    .footer {

      text-align: center;

      margin-top: 17px;

      color: #566571;

      font-size: 7px;

      line-height: 1.8;

    }


    @media (max-width: 480px) {

      .page {

        padding: 18px 12px;

      }


      .teacher-image {

        width: 82px;

        height: 82px;

      }


      .brand h1 {

        font-size: 19px;

      }


      .register-card {

        padding: 19px;

        border-radius: 15px;

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <div class="register-wrapper">


      <!-- =====================
           الهوية
      ====================== -->


      <section class="brand">


        <div class="teacher-image">

          <img
            src="55.jpg"
            alt="مهندس محمد صلاح"
          >

        </div>


        <h1>
          مهندس محمد صلاح
        </h1>


        <p>
          منصة تعليم الفيزياء
        </p>


      </section>



      <!-- =====================
           التسجيل
      ====================== -->


      <section class="register-card">


        <div class="card-title">

          <h2>
            إنشاء حساب جديد
          </h2>

          <p>
            أدخل بياناتك لإنشاء حسابك
            على منصة مهندس محمد صلاح.
          </p>

        </div>



        <form id="registerForm">


          <!-- =====================
               بيانات الطالب
          ====================== -->


          <div class="section-title">
            بيانات الطالب
          </div>



          <!-- الاسم -->


          <div class="field">

            <label for="fullName">

              الاسم بالكامل

              <span class="required">
                *
              </span>

            </label>


            <div class="input-wrapper">

              <span class="input-icon">
                👤
              </span>


              <input
                id="fullName"
                type="text"
                placeholder="اكتب اسمك بالكامل"
                autocomplete="name"
                required
              >

            </div>

          </div>



          <!-- رقم الطالب -->


          <div class="field">

            <label for="studentPhone">

              رقم الطالب

              <span class="required">
                *
              </span>

            </label>


            <div class="input-wrapper">

              <span class="input-icon">
                📱
              </span>


              <input
                id="studentPhone"
                type="tel"
                inputmode="numeric"
                placeholder="01xxxxxxxxx"
                autocomplete="tel"
                required
              >

            </div>

          </div>



          <!-- الصف الدراسي -->


          <div class="field">

            <label for="grade">

              الفصل الدراسي / الصف

              <span class="required">
                *
              </span>

            </label>


            <div class="input-wrapper">

              <span class="input-icon">
                🎓
              </span>


              <select
                id="grade"
                required
              >

                <option
                  value=""
                  selected
                  disabled
                >
                  اختر الصف الدراسي
                </option>


                <option value="أولى ثانوي">
                  أولى ثانوي
                </option>


                <option value="تانية ثانوي">
                  تانية ثانوي
                </option>


                <option value="تالتة ثانوي">
                  تالتة ثانوي
                </option>

              </select>

            </div>

          </div>



          <!-- كود المنصة -->


          <div class="field">

            <label for="platformCode">

              كود المنصة

              <span class="required">
                *
              </span>

            </label>


            <div class="input-wrapper">

              <span class="input-icon">
                🔑
              </span>


              <input
                id="platformCode"
                type="text"
                placeholder="مثال: MSP-A7K92X4Q"
                autocomplete="off"
                autocapitalize="characters"
                required
              >

            </div>

          </div>



          <!-- =====================
               بيانات الحساب
          ====================== -->


          <div class="section-title">
            بيانات الحساب
          </div>



          <!-- البريد -->


          <div class="field">

            <label for="email">

              البريد الإلكتروني

              <span class="optional">
                اختياري
              </span>

            </label>


            <div class="input-wrapper">

              <span class="input-icon">
                ✉
              </span>


              <input
                id="email"
                type="email"
                placeholder="example@email.com"
                autocomplete="email"
              >

            </div>

          </div>



          <!-- كلمة المرور -->


          <div class="field">

            <label for="password">

              كلمة المرور

              <span class="required">
                *
              </span>

            </label>


            <div class="password-wrapper">

              <input
                id="password"
                type="password"
                placeholder="6 أحرف أو أكثر"
                autocomplete="new-password"
                minlength="6"
                required
              >


              <button
                type="button"
                class="show-password"
                id="showPassword"
              >
                إظهار
              </button>

            </div>


            <div class="password-strength">

              <div
                class="password-strength-bar"
                id="passwordStrength"
              ></div>

            </div>


            <div class="password-hint">
              استخدم كلمة مرور قوية لا تقل عن 6 أحرف.
            </div>

          </div>



          <!-- =====================
               بيانات ولي الأمر
          ====================== -->


          <div class="section-title">
            بيانات ولي الأمر
          </div>



          <!-- اسم ولي الأمر -->


          <div class="field">

            <label for="parentName">

              اسم ولي الأمر

              <span class="required">
                *
              </span>

            </label>


            <div class="input-wrapper">

              <span class="input-icon">
                👨‍👩‍👦
              </span>


              <input
                id="parentName"
                type="text"
                placeholder="اسم ولي الأمر"
                autocomplete="name"
                required
              >

            </div>

          </div>



          <!-- رقم ولي الأمر -->


          <div class="field">

            <label for="parentPhone">

              رقم هاتف ولي الأمر

              <span class="required">
                *
              </span>

            </label>


            <div class="input-wrapper">

              <span class="input-icon">
                📞
              </span>


              <input
                id="parentPhone"
                type="tel"
                inputmode="numeric"
                placeholder="01xxxxxxxxx"
                autocomplete="tel"
                required
              >

            </div>

          </div>



          <!-- =====================
               الموافقة
          ====================== -->


          <label class="terms">

            <input
              type="checkbox"
              id="terms"
              required
            >


            <span>

              أوافق على إنشاء حساب على المنصة
              وأؤكد أن البيانات التي أدخلتها صحيحة.

            </span>

          </label>



          <!-- =====================
               زر التسجيل
          ====================== -->


          <button
            type="submit"
            class="register-button"
            id="registerButton"
          >

            إنشاء الحساب

          </button>



          <!-- الرسالة -->


          <div
            class="message"
            id="message"
          ></div>


        </form>



        <!-- =====================
             تسجيل الدخول
        ====================== -->


        <div class="login-box">

          <p>
            لديك حساب بالفعل؟
          </p>


          <a
            href="login.html"
            class="login-button"
          >

            تسجيل الدخول

          </a>

        </div>


      </section>



      <!-- Footer -->


      <div class="footer">

        منصة مهندس محمد صلاح للفيزياء

        <br>

        جميع الحقوق محفوظة © 2026

      </div>


    </div>

  </main>



  <script>


    /* ==================================================
       إعداد Supabase
    ================================================== */


    const SUPABASE_URL =
      "https://sbntgoxxrxnbsqgfvjkc.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_MIaPgcpnmUYdXQZHWcv15A_f5bOkfMc";


    const {
      createClient
    } = window.supabase;


    const supabaseClient =
      createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY,

        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }

      );



    /* ==================================================
       عناصر الصفحة
    ================================================== */


    const registerForm =
      document.getElementById(
        "registerForm"
      );


    const fullNameInput =
      document.getElementById(
        "fullName"
      );


    const studentPhoneInput =
      document.getElementById(
        "studentPhone"
      );


    const gradeInput =
      document.getElementById(
        "grade"
      );


    const platformCodeInput =
      document.getElementById(
        "platformCode"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const parentNameInput =
      document.getElementById(
        "parentName"
      );


    const parentPhoneInput =
      document.getElementById(
        "parentPhone"
      );


    const termsInput =
      document.getElementById(
        "terms"
      );


    const registerButton =
      document.getElementById(
        "registerButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    const showPassword =
      document.getElementById(
        "showPassword"
      );


    const passwordStrength =
      document.getElementById(
        "passwordStrength"
      );



    /* ==================================================
       إظهار / إخفاء كلمة المرور
    ================================================== */


    showPassword.addEventListener(
      "click",
      function () {


        if (
          passwordInput.type ===
          "password"
        ) {


          passwordInput.type =
            "text";


          showPassword.textContent =
            "إخفاء";


        } else {


          passwordInput.type =
            "password";


          showPassword.textContent =
            "إظهار";

        }

      }
    );



    /* ==================================================
       قوة كلمة المرور
    ================================================== */


    passwordInput.addEventListener(
      "input",
      function () {


        const password =
          passwordInput.value;


        let strength = 0;


        if (password.length >= 6) {
          strength += 25;
        }


        if (password.length >= 8) {
          strength += 25;
        }


        if (/[A-Z]/.test(password)) {
          strength += 20;
        }


        if (/[0-9]/.test(password)) {
          strength += 15;
        }


        if (
          /[^A-Za-z0-9]/.test(password)
        ) {

          strength += 15;

        }


        passwordStrength.style.width =
          strength + "%";


      }
    );



    /* ==================================================
       تنظيف كود المنصة
    ================================================== */


    platformCodeInput.addEventListener(
      "input",
      function () {


        platformCodeInput.value =
          platformCodeInput.value
            .trim()
            .toUpperCase();

      }
    );



    /* ==================================================
       التحقق من رقم الهاتف المصري
    ================================================== */


    function isValidEgyptianPhone(
      phone
    ) {


      return /^01[0125][0-9]{8}$/
        .test(phone);

    }



    /* ==================================================
       إنشاء بريد تقني عند عدم إدخال البريد
    ================================================== */


    function createInternalEmail(
      studentPhone
    ) {


      const cleanPhone =
        studentPhone.replace(
          /\D/g,
          ""
        );


      return (
        "student_" +
        cleanPhone +
        "@mohamedsalah-platform.local"
      );

    }



    /* ==================================================
       رسالة للمستخدم
    ================================================== */


    function showMessage(
      text,
      type
    ) {


      message.textContent =
        text;


      message.className =
        "message " + type;

    }



    function clearMessage() {


      message.textContent =
        "";


      message.className =
        "message";

    }



    /* ==================================================
       التسجيل
    ================================================== */


    registerForm.addEventListener(
      "submit",
      async function (event) {


        event.preventDefault();


        clearMessage();


        const fullName =
          fullNameInput.value.trim();


        const studentPhone =
          studentPhoneInput.value.trim();


        const grade =
          gradeInput.value;


        const platformCode =
          platformCodeInput.value
            .trim()
            .toUpperCase();


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        const parentName =
          parentNameInput.value.trim();


        const parentPhone =
          parentPhoneInput.value.trim();



        /* =========================
           التحقق
        ========================== */


        if (!fullName) {

          showMessage(
            "اكتب اسم الطالب بالكامل.",
            "error"
          );

          fullNameInput.focus();

          return;

        }



        if (
          !isValidEgyptianPhone(
            studentPhone
          )
        ) {

          showMessage(
            "اكتب رقم طالب مصري صحيح مكون من 11 رقم.",
            "error"
          );

          studentPhoneInput.focus();

          return;

        }



        if (!grade) {

          showMessage(
            "اختار الصف الدراسي.",
            "error"
          );

          gradeInput.focus();

          return;

        }



        if (!platformCode) {

          showMessage(
            "اكتب كود المنصة.",
            "error"
          );

          platformCodeInput.focus();

          return;

        }



        if (
          password.length < 6
        ) {

          showMessage(
            "كلمة المرور يجب ألا تقل عن 6 أحرف.",
            "error"
          );

          passwordInput.focus();

          return;

        }



        if (!parentName) {

          showMessage(
            "اكتب اسم ولي الأمر.",
            "error"
          );

          parentNameInput.focus();

          return;

        }



        if (
          !isValidEgyptianPhone(
            parentPhone
          )
        ) {

          showMessage(
            "اكتب رقم ولي الأمر المصري بشكل صحيح.",
            "error"
          );

          parentPhoneInput.focus();

          return;

        }



        if (!termsInput.checked) {

          showMessage(
            "يجب الموافقة على الشروط لإنشاء الحساب.",
            "error"
          );

          return;

        }



        /* =========================
           البريد
        ========================== */


        const accountEmail =
          email ||
          createInternalEmail(
            studentPhone
          );



        /* =========================
           تعطيل الزر
        ========================== */


        registerButton.disabled =
          true;


        registerButton.textContent =
          "جاري إنشاء الحساب...";



        try {


          /* =======================
             1. التأكد من كود المنصة
          ======================== */


          const {
            data: codeData,
            error: codeError
          } =
            await supabaseClient

              .from("platform_codes")

              .select(
                "code, used"
              )

              .eq(
                "code",
                platformCode
              )

              .maybeSingle();



          if (codeError) {

            console.error(
              codeError
            );

            showMessage(
              "تعذر التحقق من كود المنصة. تأكد أن قاعدة البيانات جاهزة.",
              "error"
            );

            return;

          }



          if (!codeData) {

            showMessage(
              "كود المنصة غير موجود.",
              "error"
            );

            return;

          }



          if (codeData.used) {

            showMessage(
              "كود المنصة مستخدم بالفعل.",
              "error"
            );

            return;

          }



          /* =======================
             2. التأكد من عدم تكرار الرقم
          ======================== */


          const {
            data: existingStudents,
            error: existingError
          } =
            await supabaseClient

              .from("profiles")

              .select("id")

              .eq(
                "student_phone",
                studentPhone
              )

              .limit(1);



          if (existingError) {

            console.error(
              existingError
            );

          } else if (
            existingStudents &&
            existingStudents.length > 0
          ) {

            showMessage(
              "رقم الطالب مسجل بالفعل.",
              "error"
            );

            return;

          }



          /* =======================
             3. إنشاء الحساب
          ======================== */


          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signUp({

                email:
                  accountEmail,

                password:
                  password,

                options: {

                  data: {

                    full_name:
                      fullName,

                    student_phone:
                      studentPhone,

                    grade:
                      grade,

                    platform_code:
                      platformCode,

                    parent_name:
                      parentName,

                    parent_phone:
                      parentPhone

                  }

                }

              });



          if (error) {

            console.error(
              "Signup error:",
              error
            );


            let errorMessage =
              "تعذر إنشاء الحساب.";


            if (
              error.message
                .toLowerCase()
                .includes(
                  "already registered"
                )
            ) {

              errorMessage =
                "هذا الحساب مسجل بالفعل.";

            }


            showMessage(
              errorMessage,
              "error"
            );

            return;

          }



          /* =======================
             4. نجاح
          ======================== */


          showMessage(
            "تم إنشاء الحساب بنجاح. جاري الانتقال...",
            "success"
          );


          registerButton.textContent =
            "تم إنشاء الحساب";


          setTimeout(
            function () {


              /*
               * مؤقتًا نذهب إلى تسجيل الدخول.
               *
               * بعد ما نعمل Dashboard
               * هنوجه الطالب إليه مباشرة.
               */


              window.location.href =
                "login.html";


            },
            1200
          );


        } catch (error) {


          console.error(
            "Unexpected registration error:",
            error
          );


          showMessage(
            "حدث خطأ غير متوقع. حاول مرة أخرى.",
            "error"
          );


        } finally {


          if (
            registerButton.textContent !==
            "تم إنشاء الحساب"
          ) {


            registerButton.disabled =
              false;


            registerButton.textContent =
              "إنشاء الحساب";

          }

        }

      }
    );

  </script>


</body>

</html>
